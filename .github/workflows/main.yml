name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '9'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      
      - name: Build arch-pm
        run: pnpm --filter "@workspace/arch-pm" run build
        env:
          PORT: '3000'
          BASE_PATH: '/ProjectManagement/'
      
      - name: Create 404.html for client-side routing
        run: cp ./artifacts/arch-pm/dist/index.html ./artifacts/arch-pm/dist/404.html
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./artifacts/arch-pm/dist
